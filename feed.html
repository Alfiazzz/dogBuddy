<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogBuddy — собаки рядом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .dog-card {
      position: relative;
      overflow: hidden;
    }

    .dog-photo,
    .dog-placeholder {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--tg-bg);
    }

    .dog-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 700;
      color: var(--primary);
    }

    .dog-name {
      margin: 12px 0 0;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .dog-meta {
      margin: 4px 0 0;
      text-align: center;
    }

    .badge-vaccinated {
      position: absolute;
      top: 24px;
      right: 24px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #4CAF50;
      color: #ffffff;
      font-size: 13px;
    }

    .bar {
      height: 6px;
      margin-top: 8px;
      border-radius: 3px;
      background: #E5E5EA;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .bar-high {
      background: #4CAF50;
    }

    .bar-mid {
      background: #FF6B35;
    }

    .bar-low {
      background: #FF6B6B;
    }

    .like-btn {
      width: 100%;
      margin-top: 12px;
    }

    .dog-card.is-liked {
      opacity: 0.55;
    }

    .match-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.45);
    }

    .match-modal.is-visible {
      display: flex;
    }

    .match-dialog {
      width: 100%;
      max-width: 360px;
      padding: 24px 16px;
      text-align: center;
    }

    .match-title {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 700;
    }

    .match-dialog .btn-primary,
    .match-dialog .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body data-requires-dog="1">
  <main class="mx-auto min-h-screen max-w-md px-4 py-6">
    <a class="btn-secondary mb-4 flex items-center justify-center no-underline" href="profile.html">Назад в профиль</a>
    <h1 class="mb-4">Собаки рядом</h1>
    <div id="dog-feed" class="flex flex-col gap-4"></div>
  </main>

  <div id="match-modal" class="match-modal">
    <div class="card match-dialog">
      <p class="match-title">Это мэтч! 🎉</p>
      <a id="match-chat-link" class="btn-primary" href="chat.html">Перейти в чат</a>
      <button id="match-close" class="btn-secondary" type="button">Продолжить поиск</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
