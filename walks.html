<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogBuddy — прогулки</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="mx-auto min-h-screen max-w-md px-4 py-6">
    <h1 class="mb-4">Мои прогулки</h1>
    <section class="card flex flex-col gap-4 p-4">
      <p>Раздел в разработке</p>
      <button class="btn-secondary" id="back-menu" type="button">Назад в меню</button>
    </section>
  </main>
  <script>
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    document.getElementById('back-menu').addEventListener('click', function () {
      if (tg) {
        tg.close();
      }
    });
  </script>
</body>
</html>
