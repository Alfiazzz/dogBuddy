<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogBuddy — чат</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body.chat-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 16px;
      background: var(--tg-card);
    }

    .chat-back {
      flex-shrink: 0;
      color: var(--primary);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .chat-partner-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .chat-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #E5E5EA;
      color: #FF6B35;
      font-size: 18px;
      font-weight: 600;
    }

    #chat-partner {
      margin: 0;
      overflow: hidden;
      font-size: 18px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 16px;
    }

    .chat-empty {
      margin: auto;
      text-align: center;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
    }

    .chat-bubble-in {
      align-self: flex-start;
      background: #E5E5EA;
      color: #222222;
      border-radius: 18px 18px 18px 4px;
    }

    .chat-bubble-out {
      align-self: flex-end;
      background: #FF6B35;
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
    }

    .chat-text {
      margin: 0;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .chat-time {
      display: block;
      margin-top: 4px;
      font-size: 11px;
    }

    .chat-bubble-in .chat-time {
      color: #8e8e93;
    }

    .chat-bubble-out .chat-time {
      color: rgba(255, 255, 255, 0.85);
    }

    .chat-status {
      min-height: 18px;
      margin: 0;
      padding: 0 16px;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: var(--tg-card);
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 16px;
      border: none;
      border-radius: 20px;
      background: #ffffff;
      color: #222222;
      font-size: 15px;
    }

    .chat-send {
      flex-shrink: 0;
      padding: 0 16px;
    }

    .chat-walks {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding: 8px 16px 0;
    }

    .chat-walks[hidden] {
      display: none !important;
    }

    .walk-list-title {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
    }

    .walk-card {
      padding: 12px;
      background: var(--tg-card);
      border-radius: 12px;
    }

    .walk-place {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .walk-meta {
      margin: 4px 0 0;
      font-size: 13px;
    }

    .walk-status-proposed {
      color: #FF6B35;
    }

    .walk-status-confirmed,
    .walk-status-done {
      color: #4CAF50;
    }

    .walk-review-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 8px;
      text-decoration: none;
    }

    .walk-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .walk-actions button {
      flex: 1;
      height: 48px;
    }

    .chat-walk-link {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 16px 8px;
      text-decoration: none;
    }
  </style>
</head>
<body class="chat-page" data-requires-dog="1">
  <div id="network-banner" class="network-banner hidden">⚠️ Нет подключения к интернету</div>
  <div id="network-indicator" class="network-indicator online"></div>
  <header class="chat-header">
    <a class="chat-back" href="feed.html">← Назад</a>
    <div class="chat-partner-wrap">
      <div id="chat-avatar" class="chat-avatar">?</div>
      <h1 id="chat-partner">Чат</h1>
    </div>
  </header>

  <div id="chat-walks" class="chat-walks" hidden></div>
  <div id="messages-container" class="chat-messages"></div>
  <p id="chat-status" class="hint chat-status"></p>
  <a id="chat-walk-link" class="btn-secondary chat-walk-link" href="walk.html">Предложить прогулку</a>

  <form id="chat-form" class="chat-form">
    <input id="chat-text" class="chat-input" type="text" name="text" maxlength="1000" placeholder="Напишите сообщение" aria-label="Сообщение" autocomplete="off">
    <button class="btn-primary chat-send" type="submit">Отправить</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
