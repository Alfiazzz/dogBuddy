<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogBuddy — настройки</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-requires-dog="1">
  <div id="network-banner" class="network-banner hidden">⚠️ Нет подключения к интернету</div>
  <div id="network-indicator" class="network-indicator online"></div>
  <main class="mx-auto min-h-screen max-w-md px-4 py-6">
    <h1 class="mb-4">Настройки</h1>
    <section class="card flex flex-col gap-4 p-4">
      <p>Раздел в разработке</p>
      <a class="btn-secondary no-underline" href="index.html">Назад в меню</a>
    </section>

    <section class="danger-zone">
      <h2 class="danger-title">Опасная зона</h2>
      <p class="danger-note">Это действие необратимо. Все ваши данные, лайки и чаты будут удалены без возможности восстановления.</p>
      <button id="delete-account" class="btn-danger" type="button">Удалить аккаунт и собаку</button>
    </section>
  </main>

  <div id="delete-modal" class="delete-modal is-hidden">
    <div class="delete-modal-card" role="dialog" aria-modal="true" aria-labelledby="delete-modal-text">
      <p id="delete-modal-text">Вы уверены? Ваша собака и все данные будут удалены навсегда.</p>
      <button id="delete-cancel" class="btn-muted" type="button">Отмена</button>
      <button id="delete-confirm" class="btn-danger" type="button">Удалить навсегда</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
